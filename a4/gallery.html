<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cat's Photo Gallery - A4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>My Cat's Photo Gallery</h1>
            <p class="subtitle">
                Three favorite moments from my cat's everyday life.
            </p>

            <nav>
                <a href="index.html" class="button">Home</a>
            </nav>
        </header>

        <main>
            <section class="content-box">
                <h2>My Cat in Three Photos</h2>
                <p>
                    Click on any photo to open the original
                    full-size image in a new browser tab.
                </p>

                <div class="gallery">

                    <!-- First photo -->
                    <figure>
                        <a href="images/photo.jpeg"
                           target="_blank"
                           rel="noopener noreferrer">
                            <img src="images/photo.jpeg"
                                 alt="My cat resting on a wooden shelf next to a sauna heater">
                        </a>
                        <figcaption>Near the sauna</figcaption>
                    </figure>

                    <!-- Second photo -->
                    <figure>
                        <a href="images/mycat1.jpg"
                           target="_blank"
                           rel="noopener noreferrer">
                            <img src="images/mycat1.jpg"
                                 alt="My cat resting on a favorite shelf indoors">
                        </a>
                        <figcaption>On his favorite shelf</figcaption>
                    </figure>

                    <!-- Third photo -->
                    <figure>
                        <a href="images/mycat2.jpg"
                           target="_blank"
                           rel="noopener noreferrer">
                            <img src="images/mycat2.jpg"
                                 alt="My cat sleeping comfortably on my chair at home">
                        </a>
                        <figcaption>Relaxing at home</figcaption>
                    </figure>

                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Basics of Web Development Project</p>
            <p>Modified by: Viktor Khevavasam</p>
        </footer>
    </div>

</body>
</html>
