<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cat's Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>My Cat's Photo Gallery</h1>
            <p class="subtitle">More of my cat's favorite spots.</p>

            <nav>
                <a href="index.html" class="button">Home</a>
                <a href="gallery.html" class="button" aria-current="page">Gallery</a>
            </nav>
        </header>

        <main>
            <section class="content-box">
                <h2>My Cat in Three Photos</h2>
                <p>Here are three photographs of my cat in his favorite places.</p>

                <div class="gallery">
                    <figure>
                        <img src="images/photo.jpeg"
                             alt="my cat resting on a small wooden shelf in a bathroom next to a sauna heater">
                        <figcaption>Near the sauna</figcaption>
                    </figure>

                    <figure>
                        <img src="images/mycat1.jpg"
                             alt="My cat resting on his favorite spot">    
                        <figcaption>On his favorite shelf</figcaption>
                    </figure>

                    <figure>
                        <img src="images/mycat2.jpg"
                             alt="My cat sleeping in my chair">
                        <figcaption>Relaxing at home</figcaption>
                    </figure>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Basics of Web Development Project</p>
        </footer>
    </div>

</body>
</html>
